<text x="304" y="576" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#1c1c1e" stroke="#ffffff" stroke-width="4" paint-order="stroke">WifiNetworkSpecifier</text>
<text x="860" y="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#1c1c1e" stroke="#ffffff" stroke-width="4" paint-order="stroke">PTP/IP TCP 15740</text>
<text x="860" y="618" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#1c1c1e" stroke="#ffffff" stroke-width="4" paint-order="stroke">Thumbnails and whole files</text>
