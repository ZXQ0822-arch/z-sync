<text x="758.0" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#555555">[Container: Kotlin / Android]</text>
<text x="758.0" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400" fill="#1c1c1e">One process. shared/ is compiled into this APK.</text>
<text x="758.0" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400" fill="#1c1c1e">UI (Compose)</text>
<text x="758.0" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400" fill="#1c1c1e">link / Wi-Fi</text>
<text x="758.0" y="247" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400" fill="#1c1c1e">Camera session (PTP)</text>
<text x="758.0" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400" fill="#1c1c1e">PhoneGallery (MediaStore)</text>
<text x="758.0" y="289" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400" fill="#1c1c1e">EncryptedSharedPreferences file z-sync-link</text>
<text x="758.0" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#333333">SSID, password, GUID. Inside the app, not its own container.</text>
