<text x="1085.0" y="689" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#555555">[Platform]</text>
<text x="1085.0" y="708" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#1c1c1e">Pictures/Z-Sync</text>
