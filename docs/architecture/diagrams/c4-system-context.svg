<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="360" viewBox="0 0 1260 360" role="img">
  <title>System Context</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6"
            markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L11,6 L0,11 Z" fill="#1c1c1e"/>
    </marker>
  </defs>
  <text x="28" y="34" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="650" fill="#1c1c1e">System Context</text>
  <rect x="36" y="120" width="220" height="168" rx="3" fill="#f4f7fb" stroke="#163e64" stroke-width="1.6"/>
<text x="146.0" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="650" fill="#1c1c1e">Person</text>
<text x="146.0" y="169" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#555555">[Person]</text>
<text x="146.0" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#1c1c1e">Uses a phone to get</text>
<text x="146.0" y="208" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#1c1c1e">photos from the camera</text>
<rect x="430" y="96" width="330" height="216" rx="3" fill="#e7f1fa" stroke="#1b4f86" stroke-width="2.0"/>
<text x="595.0" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#1c1c1e">Z-Sync</text>
<text x="595.0" y="147" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#555555">[Software System]</text>
<text x="595.0" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#1c1c1e">Joins the camera hotspot,</text>
<text x="595.0" y="186" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#1c1c1e">browses photos, and keeps</text>
<text x="595.0" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#1c1c1e">copies on the phone</text>
<rect x="980" y="120" width="240" height="168" rx="3" fill="#f3f3f3" stroke="#5c5c5c" stroke-width="1.6"/>
<text x="1100.0" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="650" fill="#1c1c1e">Nikon Z30</text>
<text x="1100.0" y="169" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#555555">[External Software System]</text>
<text x="1100.0" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#1c1c1e">Camera hotspot and</text>
<text x="1100.0" y="208" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#1c1c1e">the photos on the card</text>
<path d="M 256 204 L 430 204" fill="none" stroke="#1c1c1e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="343" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#1c1c1e" stroke="#ffffff" stroke-width="4" paint-order="stroke">Uses</text>
<path d="M 760 204 L 980 204" fill="none" stroke="#1c1c1e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="870" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#1c1c1e" stroke="#ffffff" stroke-width="4" paint-order="stroke">Joins the camera hotspot</text>
<text x="870" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#1c1c1e" stroke="#ffffff" stroke-width="4" paint-order="stroke">and reads photos</text>
</svg>
