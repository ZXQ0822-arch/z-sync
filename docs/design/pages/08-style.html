    <p class="lead">暗色稿，就是现在应用在用的这一套。左边是全部页面。手机里的按钮按现在的用法往下走。标了「还没做」的，应用里还没有。</p>

  <main>
    <div class="stage">
      <div class="stage-phone">
        <div class="bezel">
          <div class="glass">
            <div class="status"><span>9:41</span><span>5G</span></div>
            <section class="screen on" id="style">
            <div class="topbar"><b>今天</b><a class="textbtn" href="06-photos.html">关闭</a></div>
            <div class="grid">
              <div class="tile" style="background:#6e6256"></div>
              <div class="tile" style="background:#8d7358"></div>
              <div class="tile" style="background:#3e4650"></div>
              <div class="tile" style="background:#a08a72"></div>
              <div class="tile" style="background:#5c534c"></div>
              <div class="tile" style="background:#7a8490"></div>
            </div>
            <div class="veil">
              <div class="sheet">
                <h3>风格</h3>
                <div class="seg" id="styleDial">
                  <button type="button" data-dial="P" class="on">拨盘 P</button>
                  <button type="button" data-dial="AUTO">拨盘 AUTO</button>
                </div>
                <div class="style-scroll" id="styleUses"></div>
                <div id="styleList"></div>
                <p class="hint" id="styleHint"></p>
              </div>
            </div>
            <div id="stylePage" hidden>
              <div class="pv-top">
                <button type="button" id="styleBack">返回</button>
                <span id="stylePageName"></span>
                <span id="stylePageMark"></span>
              </div>
              <div class="pad scroll" id="stylePageBody"></div>
              <div class="pad" style="flex:none">
                <button class="btn" type="button" id="styleApply" style="margin-top:0">用这个拍</button>
                <p class="hint" id="styleApplyHint"></p>
              </div>
            </div>
          </section>
          </div>
        </div>
        <p class="caption" id="caption">盖在照片上。关闭回到照片。拨盘在 AUTO 时，「用这个拍」不会记成使用中。</p>
      </div>

    </div>
  </main>
  <script src="screen.js"></script>
</body>
